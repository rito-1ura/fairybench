[package]
name = "app"
version = "0.1.0"
description = "FairyBench - Benchmark Application"
authors = ["you"]
license = ""
repository = ""
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11.3", features = ["image-ico"] }
fern = "0.7"
rusqlite = { version = "0.32", features = ["bundled"] }
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4"] }
wgpu = "23"
pollster = "0.4"
bytemuck = { version = "1", features = ["derive"] }
ed25519-dalek = { version = "2", features = ["pkcs8"] }
base64 = "0.22"
